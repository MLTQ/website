# Build the site and publish dist/ to GitHub Pages.
#
# One-time setup, in the repo on github.com:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Custom domain: set `domain` in content/site.js and push. The build writes
# dist/CNAME from that value, so the domain lives in one place. Then point DNS
# at GitHub Pages and tick "Enforce HTTPS" under Settings -> Pages.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
